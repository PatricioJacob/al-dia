# Mantiene despierto el proyecto gratis de Supabase (se pausa tras 7 días sin uso).
# - Todos los días hace una consulta liviana a la base de datos.
# - El día 1 de cada mes deja un commit mínimo, porque GitHub apaga los
#   workflows programados de repos sin actividad durante 60 días.
# Necesita dos secretos del repo: SUPABASE_URL y SUPABASE_KEY.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días, 9:17 de Argentina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/items?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          echo "Respuesta de Supabase: $code"
          test "$code" -lt 500

      - uses: actions/checkout@v4

      - name: Commit mensual para que GitHub no apague este workflow
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%d" > .ultimo-ping
            git config user.name "al-dia-bot"
            git config user.email "al-dia-bot@users.noreply.github.com"
            git add .ultimo-ping
            git commit -m "Ping mensual de mantenimiento" && git push || echo "Nada que subir"
          else
            echo "Hoy no toca commit (solo el día 1)"
          fi
