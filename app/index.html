<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Al día</title>
  <meta name="description" content="Tus pendientes, recordatorios y eventos en un solo lugar.">
  <meta name="theme-color" content="#0d0d12">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono-192.png" type="image/png">
  <!-- iPhone: que se vea como app instalada -->
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Al día">
  <script>
    // Aplicar el tema elegido antes de pintar (evita un destello del otro color)
    (function () {
      var t = 'oscuro';
      try { t = JSON.parse(localStorage.getItem('aldia.pref.tema')) || 'oscuro'; } catch (e) {}
      document.documentElement.setAttribute('data-tema', t);
      var claro = t === 'claro' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', claro ? '#f6f5f2' : '#0d0d12');
      // iPhone: texto oscuro en la barra de estado si el tema es claro
      var ios = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (ios) ios.setAttribute('content', claro ? 'default' : 'black-translucent');
    })();
  </script>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- Barra lateral (PC) -->
    <aside class="lateral" aria-label="Navegación">
      <div class="marca">
        <img src="iconos/icono-192.png" alt="" width="28" height="28">
        <span>Al día</span>
      </div>
      <nav class="lateral-nav">
        <button type="button" class="nav-item" data-vista="pendientes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>
          <span>Pendientes</span><span class="insignia" hidden></span>
        </button>
        <button type="button" class="nav-item" data-vista="calendario">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span>Calendario</span>
        </button>
      </nav>
      <button type="button" class="nav-item boton-ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></svg>
        <span>Ajustes</span>
      </button>
    </aside>

    <main id="contenido">
      <header class="cabecera">
        <div class="cabecera-textos">
          <p id="saludo" class="saludo" hidden></p>
          <h1 id="titulo-vista">Pendientes</h1>
          <p id="fecha-hoy"></p>
        </div>
        <button type="button" class="boton-icono boton-ajustes solo-movil" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></svg>
        </button>
        <div id="zona-captura" class="solo-pc"></div>
      </header>

      <div id="aviso-local" class="aviso-local" hidden>
        Modo local · lo que anotás queda solo en este dispositivo hasta que conectes Supabase.
      </div>

      <section id="vista-pendientes" class="vista" aria-label="Pendientes"></section>
      <section id="vista-calendario" class="vista" aria-label="Calendario" hidden></section>
    </main>
  </div>

  <!-- Celular: botón de anotar al alcance del pulgar -->
  <button type="button" id="boton-flotante" class="solo-movil" aria-label="Anotar algo nuevo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Celular: navegación inferior -->
  <nav class="barra-inferior solo-movil" aria-label="Navegación">
    <button type="button" class="tab" data-vista="pendientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>
      <span>Pendientes</span><span class="insignia" hidden></span>
    </button>
    <button type="button" class="tab" data-vista="calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Calendario</span>
    </button>
  </nav>

  <div id="toasts" aria-live="polite"></div>

  <!-- Inicio de sesión (solo si Supabase está configurado) -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-caja">
      <img src="iconos/icono-192.png" alt="" width="64" height="64" class="login-logo">
      <h1>Al día</h1>
      <p class="texto-suave">Entrá con tu email. Te mandamos un código, sin contraseñas.</p>
      <input id="login-email" class="campo" type="email" required autocomplete="email" inputmode="email" placeholder="tu@email.com" aria-label="Email">
      <div id="login-paso2" hidden>
        <input id="login-codigo" class="campo codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Código" aria-label="Código de 6 dígitos">
        <button type="button" id="login-cambiar" class="boton-texto">Usar otro email</button>
      </div>
      <button id="login-boton" class="boton-primario grande" type="submit">Enviarme un código</button>
      <p id="login-msg" class="login-msg" role="status"></p>
    </form>
  </div>
</body>
</html>
